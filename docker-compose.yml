services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fanlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fanlink}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fanlink}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fanlink}
      FANLINK_SESSION_KEY: ${FANLINK_SESSION_KEY:?set FANLINK_SESSION_KEY}
      VITE_AUTH_ENABLED: "true"
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - fanlink-data:/app/data
volumes:
  pgdata:
  fanlink-data:
