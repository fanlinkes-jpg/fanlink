services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fanlink
      POSTGRES_PASSWORD: fanlink
      POSTGRES_DB: fanlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://fanlink:fanlink@postgres:5432/fanlink
      FANLINK_SESSION_KEY: ${FANLINK_SESSION_KEY}
      VITE_AUTH_ENABLED: "false"
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - fanlink-data:/app/data
volumes:
  pgdata:
  fanlink-data:
