name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/of-session-crm-617f
      - cursor/mass-message-617f
      - cursor/video-vault-617f

concurrency:
  # El push y el pull request no comparten grupo: uno no cancela al otro.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    # En esta rama el push ya cubre el pull request del mismo repositorio.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fanlink
          POSTGRES_PASSWORD: fanlink
          POSTGRES_DB: fanlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanlink -d fanlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Solo los tests que leen FANLINK_TEST_DATABASE_URL. DATABASE_URL no se
      # define en el job: el resto de la suite sigue en PGlite.
      FANLINK_TEST_DATABASE_URL: postgres://fanlink:fanlink@localhost:5432/fanlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx tsc --noEmit
      - name: Migrar Postgres de prueba
        env:
          DATABASE_URL: postgres://fanlink:fanlink@localhost:5432/fanlink
        run: npm run db:migrate
      - run: npm test
      - run: npm run build
