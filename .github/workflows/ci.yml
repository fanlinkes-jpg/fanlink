name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/of-session-crm-617f

concurrency:
  # El push y el pull request no comparten grupo: uno no cancela al otro.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    # En esta rama el push ya cubre el pull request del mismo repositorio.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
